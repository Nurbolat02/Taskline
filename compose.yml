services:
    postgres:
        image: docker.io/library/postgres:18.3
        container_name: learn-fullstack-db
        restart: unless-stopped
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=123456
            - POSTGRES_DB=learn_fullstack
        ports:
            - '5433:5432'
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d learn_fullstack']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
